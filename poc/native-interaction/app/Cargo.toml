[package]
name = "hf-poc-app"
version = "0.0.1"
edition = "2021"
description = "Prova de integração nativa HF-00 (Tauri 2). Não é o produto."
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
hf-poc-core = { path = "../core" }
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-global-shortcut = "=2.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder", "NSView"] }
