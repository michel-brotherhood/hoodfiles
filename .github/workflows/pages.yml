name: Site (GitHub Pages)

# Publica a pasta site/ com GitHub Pages. Só roda manualmente (Actions → Run workflow).
# GitHub Pages em repositório privado exige plano pago; para publicar de graça, torne o repositório público
# ou hospede a pasta site/ em outro serviço. Ver docs/site.md.
# Pré-requisito no GitHub: Settings → Pages → Build and deployment → Source: "GitHub Actions".
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verificar o site (ligações, âncoras, imagens, dependências externas, tamanho)
        run: python3 -I .github/scripts/check-site.py site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write      # publicar
      id-token: write   # verificar a origem do deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
