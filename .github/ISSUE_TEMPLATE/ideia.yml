name: Ideia ou pedido
description: Sugestão de recurso, formato ou melhoria
labels: ["ideia"]
body:
  - type: textarea
    id: problema
    attributes:
      label: Que problema isso resolve?
      description: Descreva a situação, não só a solução.
    validations: { required: true }
  - type: textarea
    id: proposta
    attributes:
      label: Como você imagina que funcione
  - type: textarea
    id: alternativas
    attributes:
      label: O que você usa hoje para resolver
